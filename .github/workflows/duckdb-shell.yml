name: DuckDB shell image

on:
  pull_request:
    paths:
      - 'docker/duckdb-shell/**'
      - 'loader/**'
      - 'tests/**'
      - '.github/workflows/duckdb-shell.yml'
  push:
    branches: [main]
    paths:
      - 'docker/duckdb-shell/**'
      - 'loader/**'
      - 'tests/**'
      - '.github/workflows/duckdb-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duckdb-shell-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test loader lifecycle
        run: python3 -m unittest discover -s tests -v
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/duckdb-shell
          load: true
          tags: duckdb-shell:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image and loader
        run: sh tests/test_duckdb_shell.sh duckdb-shell:test
      - name: Check publishing credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Set Actions variable DOCKERHUB_USERNAME'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Set Actions secret DOCKERHUB_TOKEN'; exit 1; }
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish generic image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./docker/duckdb-shell
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            aksw/duckdb-shell:1.5.6
            aksw/duckdb-shell:latest
            aksw/duckdb-shell:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
